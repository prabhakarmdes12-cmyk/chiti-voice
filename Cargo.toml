[workspace]
members = [
    "crates/vocal-core",
    "crates/voice-pack",
    "apps/chiti-voice-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chiti Technologies"]
license = "Proprietary"
repository = "https://github.com/chiti-technologies/vocal-runtime"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

# ONNX Runtime for Piper inference
ort = { version = "2.0.0-rc.13", features = ["fetch-models"] }
ndarray = { version = "0.15", features = ["serde"] }

# CLI tools
clap = { version = "4.5", features = ["derive"] }

# Testing
mockito = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
