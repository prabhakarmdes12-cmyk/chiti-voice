[workspace]
members = [
    "crates/vocal-core",
    "crates/voice-pack",
    "apps/chiti-voice-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chiti Technologies"]
license = "Proprietary"
repository = "https://github.com/chiti-technologies/vocal-runtime"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

# ONNX Runtime for Piper inference.
# `fetch-models` is DELIBERATELY NOT ENABLED: it lets the runtime download model
# weights from a URL at run time, which directly violates VOICE_INV_001 (Offline
# Independence). Models must arrive only via a validated `.cvpack`.
# Enabled only behind vocal-core's `piper` feature so base builds stay network-free.
ort = "2.0.0-rc.13"
ndarray = { version = "0.15", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# `mockito` (HTTP mocking) was removed from this list: it was declared and used by
# nothing, and an HTTP test double in a crate whose core invariant is "no network
# client" invites the wrong dependency later.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Embedded/dev-profile tuning for target devices.
# `s` profiles matter because the stated product goal is small, deployable voice
# packs and runtime binaries. These are starting points, not measured results.
[profile.release-embedded]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
